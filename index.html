</head><body><p id="m">Loading the expedition&hellip;</p>

<script>
window.addEventListener('load',function(){
  var p=window.__EXP||[];
  if(p.length!==8||p.some(function(x){return !x})){document.getElementById('m').textContent='Could not load the game files. Check that the game folder was uploaded.';return;}
  var html=p.join('');window.__EXP=null;
  document.open();document.write(html);document.close();
});
